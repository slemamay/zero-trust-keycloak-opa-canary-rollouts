services:
  postgres:
    image: postgres:16
    container_name: projet44-postgres
    environment:
      POSTGRES_DB: projet44
      POSTGRES_USER: projet44
      POSTGRES_PASSWORD: projet44pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: projet44-keycloak
    command: start-dev --import-realm
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"

  opa:
    image: openpolicyagent/opa:latest
    container_name: projet44-opa
    command: run --server --addr :8181 --watch /policies
    ports:
      - "8181:8181"
    volumes:
      - ./policies:/policies

volumes:
  postgres_data: